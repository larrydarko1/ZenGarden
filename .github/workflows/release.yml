# Releasing is driven by package.json, not by pushing a tag by hand: land a `bump: version x.y.z`
# commit on main, and once CI goes green this workflow tags it, builds the installers and publishes
# the release.
# The idempotency check keys on a *published* release, not on the tag: the tag is created before the
# builds run, so keying on the tag would make every failed run unresumable — a re-run would find the
# tag, decide there was nothing to do, and quietly skip.
#
# It hangs off `workflow_run` rather than `push` so a red CI can never produce a release.

name: Release

on:
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # ── Read version and decide whether there is anything to release ──
    version:
        name: Resolve version
        if: >
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == github.repository
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        outputs:
            version: ${{ steps.pkg.outputs.version }}
            tag: ${{ steps.pkg.outputs.tag }}
            exists: ${{ steps.check.outputs.exists }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Read version from package.json
              id: pkg
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Version: $VERSION"

            - name: Check if release already published
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ steps.pkg.outputs.tag }}
              run: |
                  DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo "missing")
                  if [ "$DRAFT" = "false" ]; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "Release $TAG is already published, skipping"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "No published release for $TAG (state: $DRAFT), will release"
                  fi

    # ── Tag the commit and open a draft release for the builds to upload into ──
    prepare:
        name: Tag and open draft
        needs: version
        if: needs.version.outputs.exists == 'false'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            # This job pushes the tag, so it is the one checkout that keeps its credentials.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            # A retry of a failed release re-enters this job with the tag already pushed.
            - name: Create tag
              env:
                  TAG: ${{ needs.version.outputs.tag }}
              run: |
                  if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
                      echo "Tag $TAG already exists, reusing it"
                      exit 0
                  fi
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag -a "$TAG" -m "Release $TAG"
                  git push origin "$TAG"

            - name: Create draft release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: ${{ needs.version.outputs.tag }}
                  name: ZenGarden ${{ needs.version.outputs.tag }}
                  draft: true
                  prerelease: false
                  generate_release_notes: true
                  body: |
                      ## ZenGarden does not update itself

                      Nothing phones home and nothing installs behind your back — which also means ZenGarden
                      will never tell you a new version exists. To upgrade, download from this page and
                      replace your copy. Watch this repository if you want to hear about new releases.

                      ## Installing

                      ZenGarden ships prebuilt binaries for **Linux only**. These builds are not signed,
                      so your desktop environment may warn you the first time you open the app.

                      - **AppImage** — `chmod +x` the file, then run it.
                      - **deb / rpm** — install with your package manager.
                      - **tar.gz** — extract anywhere and run the `zen-garden` binary inside.

                      ## macOS and Android

                      There is no prebuilt download for either, and the reason is the same for both: a
                      binary that installs without a security warning has to be signed, and this project
                      has neither an Apple developer certificate nor an Android signing key it can stand
                      behind. ZenGarden is MIT licensed and both build targets are kept working, so
                      build it yourself:

                      ```sh
                      git clone https://github.com/larrydarko1/ZenGarden.git
                      cd ZenGarden && npm ci

                      npm run build:mac                            # .dmg  → dist-electron/
                      npm run build:mobile && cd android \
                          && ./gradlew assembleDebug               # .apk  → app/build/outputs/apk/debug/
                      ```

                      The Android build needs Android Studio for its JDK and SDK, and the resulting APK is
                      unsigned — your device will ask you to allow installing from an unknown source. Both
                      are untested by the maintainer; bug reports from self-built platforms are welcome but
                      are fixed on a best-effort basis. See the README for the longer version.

    # ── Installers ────────────────────────────────────────
    # Linux is the only platform this project distributes binaries for. The macOS and
    # Android jobs were both dropped deliberately, and for the same reason: neither can
    # be signed. Without a paid Apple developer certificate the only macOS option is an
    # ad-hoc signature, which Gatekeeper treats as damaged often enough that the download
    # was a worse experience than no download; without a signing key the only Android
    # option is an unsigned debug APK, which installs only once the user has allowed
    # unknown sources. Both build targets are still in the repo — `npm run build:mac`,
    # and `npm run build:mobile` then `./gradlew assembleDebug` — so anyone can build
    # their own. They are just not something CI publishes. The release body above tells
    # readers exactly that, so a missing download reads as a decision, not an outage.
    build:
        name: Build Linux packages
        needs: [version, prepare]
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - uses: ./.github/actions/node-setup

            - name: Install rpm tooling
              run: sudo apt-get update && sudo apt-get install -y rpm

            - name: Build installers
              run: npm run build:linux

            - name: Upload to draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ needs.version.outputs.tag }}
                  ASSETS: dist-electron/*.AppImage dist-electron/*.deb dist-electron/*.rpm dist-electron/*.tar.gz
              run: |
                  set -euo pipefail
                  # shellcheck disable=SC2086
                  ls -lh $ASSETS
                  # shellcheck disable=SC2086
                  gh release upload "$TAG" $ASSETS --clobber

    # ── Publish ────────────────────────────────────────────
    publish:
        name: Publish release
        needs: [version, build]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - name: Flip draft to published
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ needs.version.outputs.tag }}
              run: gh release edit "$TAG" --draft=false
